version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: legacylens-db
    restart: always
    environment:
      POSTGRES_USER: legacylens
      POSTGRES_PASSWORD: legacylens_password
      POSTGRES_DB: legacylens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacylens -d legacylens"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legacylens-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://legacylens:legacylens_password@db:5432/legacylens
      - SECRET_KEY=supersecret-enterprise-production-key-change-in-prod
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - WORKSPACE_DIR=/app/workspace
    ports:
      - "8000:8000"
    volumes:
      - workspace_data:/app/workspace
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legacylens-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  workspace_data:
