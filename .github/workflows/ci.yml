name: CI / QA Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  backend-qa:
    name: Backend QA (Lint · Typecheck · Security · Test · Coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy pytest pytest-cov httpx bandit flake8 pip-audit

      - name: Lint (Flake8)
        run: flake8 app --max-line-length=120 --extend-ignore=E501,W503

      - name: Type Check (Mypy)
        run: mypy app --ignore-missing-imports

      - name: Security Scan – Code (Bandit)
        run: bandit -r app -ll

      - name: Security Scan – Dependencies (pip-audit)
        run: pip-audit --requirement requirements.txt || true   # warn-only until all deps are pinned

      - name: Run Tests with Coverage
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=70

  # ─────────────────────────────────────────────────────────────────────────
  frontend-qa:
    name: Frontend QA (Lint · Typecheck · Security · Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Security Scan – Dependencies (npm audit)
        run: npm audit --audit-level=high || true   # warn-only for existing deps

      - name: Lint (ESLint)
        run: npm run lint

      - name: TypeScript & Vite Build
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

